<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블록 팡팡! 규칙 테스트</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 20px 16px 40px; background: #0d1336; color: #f4f6ff; font: 15px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    #summary { font-size: 18px; font-weight: 800; margin: 0 0 14px; }
    #summary.ok { color: #5cea9e; }
    #summary.fail { color: #ff7b88; }
    ul { list-style: none; padding: 0; margin: 0; max-width: 820px; }
    li { padding: 7px 0; border-bottom: 1px solid #2a3780; }
    .pass::before { content: "통과  "; color: #5cea9e; font-weight: 800; }
    .fail::before { content: "실패  "; color: #ff7b88; font-weight: 800; }
    .err { display: block; color: #ffb0b8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>블록 팡팡! 규칙 테스트</h1>
  <p id="summary">실행 중</p>
  <ul id="results"></ul>
  <script src="../game.js"></script>
  <script src="rules.spec.js"></script>
  <script>
    (function () {
      function fail(msg) { throw new Error(msg || '검증 실패'); }
      const assert = {
        ok: function (v, msg) { if (!v) fail(msg); },
        equal: function (a, b, msg) { if (a !== b) fail((msg || '') + ' 기대값 ' + b + ', 실제값 ' + a); },
        notEqual: function (a, b, msg) { if (a === b) fail((msg || '') + ' 달라야 함'); },
        deepEqual: function (a, b, msg) {
          if (JSON.stringify(a) !== JSON.stringify(b)) {
            fail((msg || '') + ' 기대값 ' + JSON.stringify(b) + ', 실제값 ' + JSON.stringify(a));
          }
        },
      };

      const list = document.getElementById('results');
      let passed = 0;
      let failed = 0;

      function test(name, fn) {
        const li = document.createElement('li');
        li.textContent = name;
        try {
          fn();
          passed++;
          li.className = 'pass';
        } catch (err) {
          failed++;
          li.className = 'fail';
          const e = document.createElement('span');
          e.className = 'err';
          e.textContent = err.message;
          li.appendChild(e);
        }
        list.appendChild(li);
      }

      RulesSpec.defineTests(BlockPang.Core, test, assert);
      const summary = document.getElementById('summary');
      summary.textContent = '통과 ' + passed + ' / 실패 ' + failed;
      summary.className = failed ? 'fail' : 'ok';
    })();
  </script>
</body>
</html>
