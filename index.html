<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1336">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="8×8 판에 블록을 채워 줄을 터뜨리는 퍼즐 게임, 블록 팡팡!">
  <title>블록 팡팡!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%23ffd84a'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%234d9bff'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%2346e08c'/%3E%3Crect x='17' y='17' width='13' height='13' rx='3' fill='%23ff6db0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="game">
    <header class="topbar">
      <h1 class="brand">블록 <em>팡팡!</em></h1>
      <div class="controls">
        <button id="btn-pause" class="icon-btn" type="button" aria-label="일시정지">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.5" height="15" rx="1.5"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.5"/></svg>
        </button>
        <button id="btn-restart" class="icon-btn" type="button" aria-label="다시 시작">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 9.3 1.5 1.5 0 0 1 2.8-1A4 4 0 1 0 12 8v2.3c0 .6-.7 1-1.2.6L6.6 7.7a.8.8 0 0 1 0-1.3l4.2-3.2c.5-.4 1.2 0 1.2.6z"/></svg>
        </button>
        <button class="icon-btn sound-toggle" type="button" aria-label="사운드 끄기">
          <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5c0 .6.4 1 1 1h3l4.3 3.4c.7.5 1.7 0 1.7-.8V5.9c0-.8-1-1.3-1.7-.8L8 8.5H5c-.6 0-1 .4-1 1z"/><path d="M17 8.2a1 1 0 0 1 1.4.1 5.6 5.6 0 0 1 0 7.4 1 1 0 1 1-1.5-1.3 3.6 3.6 0 0 0 0-4.8 1 1 0 0 1 .1-1.4z"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5c0 .6.4 1 1 1h3l4.3 3.4c.7.5 1.7 0 1.7-.8V5.9c0-.8-1-1.3-1.7-.8L8 8.5H5c-.6 0-1 .4-1 1z"/><path d="M16.3 9.3a1 1 0 0 1 1.4 0l1.3 1.3 1.3-1.3a1 1 0 1 1 1.4 1.4L20.4 12l1.3 1.3a1 1 0 0 1-1.4 1.4L19 13.4l-1.3 1.3a1 1 0 0 1-1.4-1.4l1.3-1.3-1.3-1.3a1 1 0 0 1 0-1.4z"/></svg>
        </button>
      </div>
    </header>

    <section class="scores" aria-label="점수">
      <div class="score-card">
        <span class="score-label">점수</span>
        <strong id="score" class="score-value" aria-live="polite">0</strong>
      </div>
      <div id="combo" class="combo-chip">
        <span class="score-label">콤보</span>
        <strong id="combo-value" class="combo-value">–</strong>
        <span id="combo-pips" class="combo-pips" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="score-card is-best">
        <span class="score-label">최고 점수</span>
        <strong id="best" class="score-value">0</strong>
      </div>
    </section>

    <section id="board-wrap" class="board-wrap">
      <div id="board" class="board" aria-label="8×8 게임판"></div>
      <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
      <div id="hint" class="hint" hidden>
        <span class="hint-arrow" aria-hidden="true"></span>
        블록을 끌어서 판에 놓아 보세요
      </div>
    </section>

    <section id="tray" class="tray" aria-label="놓을 수 있는 블록">
      <div class="slot" data-slot="0" role="button"></div>
      <div class="slot" data-slot="1" role="button"></div>
      <div class="slot" data-slot="2" role="button"></div>
    </section>
  </main>

  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <div id="ghost" class="ghost" hidden aria-hidden="true">
    <div id="ghost-inner" class="ghost-inner"></div>
  </div>

  <!-- 첫 화면 -->
  <section id="screen-title" class="screen screen-title">
    <button class="icon-btn sound-toggle title-sound" type="button" aria-label="사운드 끄기">
      <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5c0 .6.4 1 1 1h3l4.3 3.4c.7.5 1.7 0 1.7-.8V5.9c0-.8-1-1.3-1.7-.8L8 8.5H5c-.6 0-1 .4-1 1z"/><path d="M17 8.2a1 1 0 0 1 1.4.1 5.6 5.6 0 0 1 0 7.4 1 1 0 1 1-1.5-1.3 3.6 3.6 0 0 0 0-4.8 1 1 0 0 1 .1-1.4z"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5c0 .6.4 1 1 1h3l4.3 3.4c.7.5 1.7 0 1.7-.8V5.9c0-.8-1-1.3-1.7-.8L8 8.5H5c-.6 0-1 .4-1 1z"/><path d="M16.3 9.3a1 1 0 0 1 1.4 0l1.3 1.3 1.3-1.3a1 1 0 1 1 1.4 1.4L20.4 12l1.3 1.3a1 1 0 0 1-1.4 1.4L19 13.4l-1.3 1.3a1 1 0 0 1-1.4-1.4l1.3-1.3-1.3-1.3a1 1 0 0 1 0-1.4z"/></svg>
    </button>
    <div class="title-inner">
      <h2 class="logo" aria-label="블록 팡팡!">
        <span class="logo-row">
          <span class="tile logo-tile" data-c="1">블</span>
          <span class="tile logo-tile" data-c="4">록</span>
        </span>
        <span class="logo-row">
          <span class="tile logo-tile" data-c="2">팡</span>
          <span class="tile logo-tile" data-c="3">팡</span>
          <span class="tile logo-tile" data-c="6">!</span>
        </span>
      </h2>
      <p class="tagline">채우고, 맞추고, 팡팡 터뜨리자</p>
      <div class="title-best">
        <span>최고 점수</span>
        <strong id="title-best">0</strong>
      </div>
      <button id="btn-start" class="btn btn-primary btn-large" type="button">시작하기</button>
      <button id="btn-howto" class="btn" type="button">게임 방법</button>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="screen-pause" class="screen" hidden>
    <div class="card" role="dialog" aria-labelledby="pause-title">
      <h2 id="pause-title" class="card-title">잠깐 쉬어요</h2>
      <button id="btn-resume" class="btn btn-primary btn-large" type="button">계속하기</button>
      <button id="btn-pause-restart" class="btn" type="button">다시 시작</button>
      <button id="btn-pause-howto" class="btn" type="button">게임 방법</button>
      <button id="btn-pause-title" class="btn" type="button">처음으로</button>
    </div>
  </section>

  <!-- 다시 시작 확인 -->
  <section id="screen-confirm" class="screen" hidden>
    <div class="card" role="dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title" class="card-title">다시 시작할까요?</h2>
      <p class="card-text">지금 판의 점수는 사라져요.</p>
      <button id="btn-confirm-yes" class="btn btn-primary btn-large" type="button">다시 시작</button>
      <button id="btn-confirm-no" class="btn" type="button">계속 플레이</button>
    </div>
  </section>

  <!-- 게임 오버 -->
  <section id="screen-over" class="screen" hidden>
    <div class="card" role="dialog" aria-labelledby="over-title">
      <h2 id="over-title" class="card-title">게임 오버</h2>
      <p id="over-record" class="record-badge" hidden>최고 기록 갱신!</p>
      <p id="over-norecord" class="card-text" hidden>놓을 수 있는 블록이 없어요</p>
      <div class="over-score-label">최종 점수</div>
      <div id="over-score" class="over-score">0</div>
      <div class="over-best">최고 점수 <strong id="over-best">0</strong></div>
      <button id="btn-retry" class="btn btn-primary btn-large" type="button">다시 도전하기</button>
      <button id="btn-over-title" class="btn" type="button">처음으로</button>
    </div>
  </section>

  <!-- 튜토리얼 -->
  <section id="screen-tutorial" class="screen screen-top" hidden>
    <div class="card tutorial scrollable" role="dialog" aria-labelledby="tutorial-title">
      <div id="tutorial-art" class="tutorial-art"></div>
      <h2 id="tutorial-title" class="card-title"></h2>
      <p id="tutorial-text" class="card-text"></p>
      <div id="tutorial-dots" class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="tutorial-nav">
        <button id="btn-tutorial-prev" class="btn" type="button">이전</button>
        <button id="btn-tutorial-next" class="btn btn-primary" type="button">다음</button>
      </div>
      <button id="btn-tutorial-skip" class="link-btn" type="button">건너뛰기</button>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
